<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>UMD Club Softball - Log In</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(rgba(17, 17, 17, 0.82), rgba(17, 17, 17, 0.88)),
                        url('https://terpconnect.umd.edu/~jbono/bmgt407/images/umd_hat.jpg') center/cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 16px;
        }
        .login-card {
            background: #ffffff;
            border-radius: 20px;
            width: 100%;
            max-width: 440px;
            padding: 40px 36px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
        }
        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #333333;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 14px;
            transition: background 0.2s;
        }
        .close-btn:hover {
            background: #4f4f4f;
            color: #ffffff;
        }
        .brand-badge {
            background: #d91a3c;
            color: #ffcc00;
            font-weight: 900;
            font-size: 24px;
            width: 46px;
            height: 46px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
        }
        .subtitle-tag {
            color: #e5a823;
            letter-spacing: 1.5px;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        .portal-title {
            font-size: 28px;
            font-weight: 900;
            color: #1a1a1a;
            letter-spacing: -0.5px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }
        .portal-desc {
            font-size: 13px;
            color: #6c757d;
            margin-bottom: 28px;
        }
        .form-label {
            font-size: 13px;
            font-weight: 700;
            color: #212529;
            margin-bottom: 6px;
        }
        .form-control {
            border-radius: 10px;
            padding: 12px 14px;
            border: 1px solid #dee2e6;
            font-size: 14px;
        }
        .form-control:focus {
            border-color: #d91a3c;
            box-shadow: 0 0 0 0.2rem rgba(217, 26, 60, 0.15);
        }
        .btn-portal-red {
            background: #d91a3c;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 700;
            font-size: 15px;
            width: 100%;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.2s;
        }
        .btn-portal-red:hover {
            background: #b51230;
            color: #ffffff;
        }
        .footer-note {
            text-align: center;
            font-size: 13px;
            color: #6c757d;
            margin-top: 20px;
        }
        .footer-note a {
            color: #d91a3c;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <a href="/" class="close-btn" aria-label="Close"><i class="bi bi-x-lg"></i></a>

        <div class="brand-badge">M</div>
        <div class="subtitle-tag">Welcome Back</div>
        <h1 class="portal-title">Log in to your portal</h1>
        <p class="portal-desc">Use your team account to continue.</p>

        <form action="{{ url_for('login') }}" method="POST">
            <div class="mb-3">
                <label for="umd_email" class="form-label">UMD email</label>
                <input type="email" class="form-control" id="umd_email" name="umd_email" placeholder="name@terpmail.umd.edu" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="At least 6 characters" required>
            </div>
            <button type="submit" class="btn btn-portal-red">
                Log in to portal <i class="bi bi-arrow-right"></i>
            </button>
        </form>

        <div class="footer-note">
            New to the team? <a href="#">Create an account</a>
        </div>
    </div>

</body>
</html>
