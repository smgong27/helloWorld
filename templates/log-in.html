<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>UMD Club Softball - Log In</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(rgba(17, 17, 17, 0.82), rgba(17, 17, 17, 0.88)),
                        url('https://terpconnect.umd.edu/~jbono/bmgt407/images/umd_hat.jpg') center/cover no-repeat;
            display: flex; align-items: center; justify-content: center;
            font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 16px;
        }
        .login-card {
            background: #fff; border-radius: 20px; width: 100%; max-width: 440px;
            padding: 40px 36px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); position: relative;
        }
        .close-btn {
            position: absolute; top: 20px; right: 20px; width: 36px; height: 36px;
            border-radius: 50%; background: #333; color: #fff; display: flex;
            align-items: center; justify-content: center; text-decoration: none; font-size: 14px;
        }
        .brand-badge {
            background: #d91a3c; color: #ffcc00; font-weight: 900; font-size: 24px;
            width: 46px; height: 46px; border-radius: 12px; display: flex;
            align-items: center; justify-content: center; margin-bottom: 24px;
        }
        .subtitle-tag { color: #e5a823; letter-spacing: 1.5px; font-size: 11px; font-weight: 800; text-transform: uppercase; }
        .portal-title { font-size: 28px; font-weight: 900; color: #1a1a1a; text-transform: uppercase; margin-bottom: 6px; }
        .portal-desc { font-size: 13px; color: #6c757d; margin-bottom: 28px; }
        .form-label { font-size: 13px; font-weight: 700; color: #212529; }
        .form-control { border-radius: 10px; padding: 12px 14px; border: 1px solid #dee2e6; }
        .btn-portal-red {
            background: #d91a3c; color: #fff; border: none; border-radius: 10px;
            padding: 12px; font-weight: 700; width: 100%; margin-top: 10px;
        }
        .btn-portal-red:hover { background: #b51230; color: #fff; }
    </style>
</head>
<body>
    <div class="login-card">
        <a href="/" class="close-btn"><i class="bi bi-x-lg"></i></a>
        <div class="brand-badge">M</div>
        <div class="subtitle-tag">Welcome Back</div>
        <h1 class="portal-title">Log in to your portal</h1>
        <p class="portal-desc">Use your team account to continue.</p>

        <form action="{{ url_for('login') }}" method="POST">
            <div class="mb-3">
                <label for="umd_email" class="form-label">UMD email</label>
                <input type="email" class="form-control" id="umd_email" name="umd_email" placeholder="name@terpmail.umd.edu" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="At least 6 characters" required>
            </div>
            <button type="submit" class="btn btn-portal-red">Log in to portal &rarr;</button>
        </form>
        <div class="text-center mt-3 small text-muted">New to the team? <a href="#" class="text-danger fw-semibold">Create an account</a></div>
    </div>
</body>
</html>
