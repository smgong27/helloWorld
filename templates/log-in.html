<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Transaction</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>
<div class="login-page-bg">

    <div class="login-card">

        <div class="card-top">
            <a href="/" class="close-btn">&times;</a>
            <img src="{{ url_for('static', filename='images/umdclubsoftballlogo.png') }}" alt="UMD Softball Logo" style="width: 60px; height: auto; margin-bottom: 15px;">
            <div class="subtitle-tag">WELCOME BACK</div>
            <h1 class="page-display-title">LOG IN TO YOUR PORTAL</h1>
            <p class="text-muted small mb-4">Use your team account to continue.</p>
        </div>

        <div class="card-bottom">
            <form action="/log-in" method="POST">

                <div class="form-group mb-3">
                    <label for="umd_email" class="form-label">UMD email</label>
                    <input type="email" id="umd_email" name="umd_email" class="form-control" placeholder="name@terpmail.umd.edu"
                           pattern=".+@(terpmail\.umd\.edu|gmail\.com)$" title="Please provide a valid @terpmail.umd.edu or @gmail.com email address."
                           required>
                </div>

                <div class="form-group  mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="At least 12 characters"
                           minlength="12" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{12,}"
                           title="Must contain at least 12 characters, including 1 uppercase letter, 1 lowercase letter, and 1 number."
                           required>
                    <div id="password-feedback" class="text-muted small mt-1">
                        Must contain: 12+ characters, uppercase, lowercase, number.
                    </div>
                </div>

                <button type="submit" class="btn-portal-red">Log in to portal &rarr;</button>
            </form>

            <p class="text-center small text-muted mt-4 mb-0">
                New to the team? <a href="/create-account" class="text-danger fw-bold text-decoration-none">Create an account</a>
            </p>
        </div>
    </div>
</div>
    <script>
        const pwdInput = document.getElementById('password');
        const feedback = document.getElementById('password-feedback');

        pwdInput.addEventListener('input', () => {
            const val = pwdInput.value;
            const hasUpper = /[A-Z]/.test(val);
            const hasLower = /[a-z]/.test(val);
            const hasNum = /\d/.test(val);
            const hasLength = val.length >= 12;

                feedback.textContent = 'Must contain: 12+ characters, uppercase, lowercase, number.';
                feedback.className = 'password-feedback pwd-feedback-invalid';
            }
        });
    </script>
</body>
</html>
