{% extends "base.html" %}

{% block title %}Create Transaction{% endblock %}

{% block content %}
<!-- Centered form container card -->
<div class="record-transaction-page">

    <!-- Back link navigation -->
    <div class="mb-3">
        <a href="/financial-ledger" class="back-link">&lsaquo; Back to Financial Ledger</a>
    </div>

    <!-- Page headings -->
    <section class="record-header">
        <div class="record-label">UMD CLUB SOFTBALL</div>
        <h1>CREATE TRANSACTION</h1>
    </section>

    <div class="content-card record-card">
        <h2 class="fs-5 fw-bold mb-2">Transaction Details</h2>
        <p class="text-muted small mb-4">Record revenue or an expense in the club's central financial ledger.</p>

        <!-- Form for creating a transaction -->
        <form action="/record-transaction" method="POST" enctype="multipart/form-data" class="portal-form">

            <div class="form-grid">
                <div class="col-md-6">
                    <label for="transactionDate" class="form-label">Transaction Date:</label>
                    <input type="date" id="transactionDate" name="transactionDate" class="form-control" required>
                </div>

                <div class="col-md-6">
                    <label for="accountID" class="form-label">Bank Account:</label>
                    <select id="accountID" name="accountID" class="form-control form-select" required>
                        <option value="" disabled selected>Select a bank account</option>
                        <option value="SGA">SGA</option>
                        <option value="SECU">SECU</option>
                        <option value="RecWell">RecWell</option>
                        <option value="Foundation">Foundation</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Team Allocation</label>
                    <div class="team-multiselect-group" role="group" aria-label="Team allocation selection">
                        <label class="team-pill-option">
                            <input type="checkbox" id="team_ncsa" name="teamID" value="NCSA" class="team-checkbox" checked>
                            <span class="team-pill-label">NCSA</span>
                        </label>
                        <label class="team-pill-option">
                            <input type="checkbox" id="team_active" name="teamID" value="Active" class="team-checkbox">
                            <span class="team-pill-label">Active</span>
                        </label>
                    </div>
                </div>

                <div class="col-md-6">
                    <label for="transactionType" class="form-label">Transaction Type:</label>
                    <select id="transactionType" name="transactionType" class="form-control form-select" required>
                        <option value="" disabled selected>Select transaction type</option>
                        <optgroup label="Expense">
                            <option value="Travel">Travel</option>
                            <option value="Hotel">Hotel</option>
                            <option value="Food">Food</option>
                            <option value="Game/Tournament Fees">Game/Tournament Fees</option>
                            <option value="Gas">Gas</option>
                            <option value="Equipment">Equipment</option>
                            <option value="Other Expense">Other Expense</option>
                        </optgroup>
                        <optgroup label="Revenue">
                            <option value="Fundraising">Fundraising</option>
                            <option value="Dues">Dues</option>
                            <option value="Donation">Donation</option>
                            <option value="Other Revenue">Other Revenue</option>
                        </optgroup>
                    </select>
                </div>

                <div class="col-md-6">
                    <label for="amount" class="form-label">Amount ($):</label>
                    <input type="number" step="0.01" id="amount" name="amount" class="form-control" placeholder="0.00" required>
                </div>

                <div class="col-md-6">
                    <label for="gameID" class="form-label">Game ID:</label>
                    <input type="text" id="gameID" name="gameID" class="form-control" placeholder="Optional (e.g., G201)">
                </div>

                <div class="col-12">
                    <label for="description" class="form-label">Description:</label>
                    <textarea id="description" name="description" rows="3" class="form-control form-textarea" placeholder="Describe the transaction" required></textarea>
                </div>

                <div class="col-12">
                    <label for="expenseReceipt" class="form-label">Upload Receipt:</label>
                    <input type="file" id="expenseReceipt" name="expenseReceipt" class="form-control file-input" accept=".pdf, .png, .jpg, .jpeg">
                </div>
            </div>

            <!-- Form Action Buttons -->
            <div class="form-actions-toolbar">
                <a href="/financial-ledger" class="btn-return-overview">Cancel</a>
                <button type="submit" class="btn-submit-upload">Submit Transaction</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
