
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Account</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Shared CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="login-page-bg">

    <div class="login-card">

        <div class="card-top">
            <a href="/" class="close-btn">&times;</a>

            <img src="{{ url_for('static', filename='images/umdclubsoftballlogo.png') }}" alt="UMD Softball Logo" style="width: 60px; height: auto; margin-bottom: 15px;">

            <div class="subtitle-tag">JOIN THE WORKSPACE</div>

            <h1 class="page-display-title">CREATE AN ACCOUNT</h1>

            <p class="text-muted small mb-4">
                Use your UMD email so team leadership can verify your membership.
            </p>
        </div>

        <div class="card-bottom">

            <form action="/create-account" method="POST">

                <div class="mb-3">
                    <label for="full_name" class="form-label">Full name</label>
                    <input type="text" class="form-control"
                           id="full_name" name="full_name"
                           placeholder="Your full name" required>
                </div>


                <div class="mb-3">
                    <label for="umd_email" class="form-label">UMD email</label>
                    <input type="email" class="form-control"
                           id="umd_email" name="umd_email"
                           placeholder="name@terpmail.umd.edu"
                           pattern=".+@(terpmail\.umd\.edu|gmail\.com)$"
                           title="Please provide a valid @terpmail.umd.edu or @gmail.com email address."
                           required>
                </div>


                <div class="mb-3">
                    <label for="team" class="form-label">Team</label>
                    <select class="form-select" id="team" name="team" required>
                        <option value="" selected disabled>Select your team</option>
                        <option value="A">NCSA</option>
                        <option value="B">Active</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="years_exp" class="form-label">Years of Experience</label>
                    <input type="text" class="form-control"
                           id="years_exp" name="years_exp"
                           placeholder="Years of Experience" required>
                </div>

                <div class="mb-3">
                    <label for="expected_grad" class="form-label">Expected Graduation Date</label>
                    <input type="text" class="form-control"
                           id="expected_grad" name="expected_grad"
                           placeholder="Expected Graduation Date" required>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control"
                           id="password" name="password"
                           placeholder="At least 12 characters"
                           minlength="12"
                           pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{12,}"
                           title="Must contain at least 12 characters, including 1 uppercase letter, 1 lowercase letter, and 1 number."
                           required>

                    <div class="text-muted small mt-1">
                        Must contain: 12+ characters, uppercase, lowercase, number.
                    </div>
                </div>


                <button type="submit" class="btn-portal-red">
                    Create team account &rarr;
                </button>

            </form>

            <p class="text-center small text-muted mt-4 mb-0">
                Already have an account?
                <a href="/log-in" class="text-danger fw-bold text-decoration-none">
                    Log in
                </a>
            </p>

        </div>

    </div>

</div>

<!-- Help Button -->
<a href="/help" class="help-button">Help</a>

</body>
</html>
